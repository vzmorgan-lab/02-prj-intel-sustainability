<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc">
  <title id="title">Intel Net-Zero 2040</title>
  <desc id="desc">Center-aligned Intel-inspired chip graphic for the 2022 Net-Zero by 2040 sustainability card.</desc>

  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#091a2b"/>
      <stop offset="50%" stop-color="#0d2238"/>
      <stop offset="100%" stop-color="#122f49"/>
    </linearGradient>

    <radialGradient id="glow" cx="55%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#91d1ff" stop-opacity="0.7"/>
      <stop offset="35%" stop-color="#5ea8ff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#091a2b" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="chipFace" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#1d2b3d"/>
      <stop offset="55%" stop-color="#121e2c"/>
      <stop offset="100%" stop-color="#0d1725"/>
    </linearGradient>

    <linearGradient id="metal" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#dce9f4"/>
      <stop offset="18%" stop-color="#a9bac9"/>
      <stop offset="50%" stop-color="#edf4fa"/>
      <stop offset="80%" stop-color="#8ea5b9"/>
      <stop offset="100%" stop-color="#dfeaf5"/>
    </linearGradient>

    <linearGradient id="green" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#89f0b8"/>
      <stop offset="100%" stop-color="#2ed27d"/>
    </linearGradient>

    <linearGradient id="leaf" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#83d49f"/>
      <stop offset="100%" stop-color="#2d9a73"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="1280" height="900" fill="url(#bg)"/>
  <rect width="1280" height="900" fill="url(#glow)"/>

  <g opacity="0.12" stroke="#7ca0d1" stroke-width="1">
    <path d="M0 140H1280M0 260H1280M0 380H1280M0 500H1280M0 620H1280M0 740H1280"/>
    <path d="M120 0V900M240 0V900M360 0V900M480 0V900M600 0V900M720 0V900M840 0V900M960 0V900M1080 0V900"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="180" y="205" width="920" height="490" rx="32" fill="#0c1925" opacity="0.85"/>
    <rect x="220" y="250" width="840" height="400" rx="28" fill="url(#chipFace)" stroke="#92a7bb" stroke-width="3"/>
  </g>

  <g opacity="0.88">
    <rect x="300" y="320" width="18" height="255" rx="8" fill="url(#metal)"/>
    <rect x="368" y="320" width="18" height="255" rx="8" fill="url(#metal)"/>
    <rect x="436" y="320" width="18" height="255" rx="8" fill="url(#metal)"/>
    <rect x="504" y="320" width="18" height="255" rx="8" fill="url(#metal)"/>
    <rect x="572" y="320" width="18" height="255" rx="8" fill="url(#metal)"/>
    <rect x="640" y="320" width="18" height="255" rx="8" fill="url(#metal)"/>
    <rect x="708" y="320" width="18" height="255" rx="8" fill="url(#metal)"/>
    <rect x="776" y="320" width="18" height="255" rx="8" fill="url(#metal)"/>
    <rect x="844" y="320" width="18" height="255" rx="8" fill="url(#metal)"/>
    <rect x="912" y="320" width="18" height="255" rx="8" fill="url(#metal)"/>
    <rect x="980" y="320" width="18" height="255" rx="8" fill="url(#metal)"/>
  </g>

  <g stroke="url(#green)" stroke-width="2" opacity="0.8">
    <path d="M270 380H1010M270 470H1010M270 560H1010"/>
    <path d="M340 310V600M430 310V600M520 310V600M610 310V600M700 310V600M790 310V600M880 310V600M970 310V600"/>
  </g>

  <g fill="#9fe8ca" opacity="0.95">
    <circle cx="340" cy="380" r="8"/>
    <circle cx="430" cy="380" r="8"/>
    <circle cx="520" cy="380" r="8"/>
    <circle cx="610" cy="380" r="8"/>
    <circle cx="700" cy="380" r="8"/>
    <circle cx="790" cy="380" r="8"/>
    <circle cx="880" cy="380" r="8"/>
    <circle cx="970" cy="380" r="8"/>

    <circle cx="340" cy="470" r="8"/>
    <circle cx="430" cy="470" r="8"/>
    <circle cx="520" cy="470" r="8"/>
    <circle cx="610" cy="470" r="8"/>
    <circle cx="700" cy="470" r="8"/>
    <circle cx="790" cy="470" r="8"/>
    <circle cx="880" cy="470" r="8"/>
    <circle cx="970" cy="470" r="8"/>

    <circle cx="340" cy="560" r="8"/>
    <circle cx="430" cy="560" r="8"/>
    <circle cx="520" cy="560" r="8"/>
    <circle cx="610" cy="560" r="8"/>
    <circle cx="700" cy="560" r="8"/>
    <circle cx="790" cy="560" r="8"/>
    <circle cx="880" cy="560" r="8"/>
    <circle cx="970" cy="560" r="8"/>
  </g>

  <g fill="#cbdbe7" opacity="0.75">
    <rect x="320" y="340" width="46" height="46" rx="10"/>
    <rect x="952" y="340" width="46" height="46" rx="10"/>
    <rect x="320" y="522" width="46" height="46" rx="10"/>
    <rect x="952" y="522" width="46" height="46" rx="10"/>
  </g>

  <g>
    <circle cx="440" cy="400" r="45" fill="#7cd297" opacity="0.85"/>
    <circle cx="510" cy="360" r="54" fill="#7cd297" opacity="0.82"/>
    <circle cx="575" cy="395" r="48" fill="#7cd297" opacity="0.8"/>
    <circle cx="640" cy="455" r="52" fill="#7cd297" opacity="0.82"/>
    <path d="M510 328 C572 370, 610 430, 516 530 C434 485, 405 418, 510 328 Z" fill="url(#leaf)" stroke="#dcffe6" stroke-width="3"/>
    <path d="M510 438 L445 492 M510 438 L572 494 M510 438 L510 526" stroke="#dcffea" stroke-width="3" stroke-linecap="round" opacity="0.72"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="240" y="116" width="800" height="76" rx="18" fill="#081b2b" opacity="0.82" stroke="#7aa9dc" stroke-width="2"/>
    <rect x="260" y="656" width="760" height="64" rx="16" fill="#0a1f2f" opacity="0.86" stroke="#68a885" stroke-width="2"/>
  </g>

  <g>
    <text x="640" y="166" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700" letter-spacing="2" fill="#a8efcd">NET ZERO</text>
    <text x="640" y="166" text-anchor="middle" dx="0" dy="54" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#8ec4ff">2040</text>
    <text x="640" y="690" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#dfeaf6">2022 • Climate Commitment • Sustainable Manufacturing</text>
  </g>
</svg>
